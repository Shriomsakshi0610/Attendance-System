name: Renaissance Teacher Android Release

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Teacher APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Copy Release APK to Static Web Downloads
        run: |
          mkdir -p src/main/resources/static/downloads
          cp android/app/build/outputs/apk/release/*.apk src/main/resources/static/downloads/renaissance-teacher.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: renaissance-teacher-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
