# ========================================================
# Renaissance - Production Profile (Render + MongoDB Atlas)
# ========================================================

# Render dynamic port binding
server.port=${PORT:8080}

# MongoDB Atlas Database URI (Injected by Render Environment Variables)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Production Security Session Cookie Configuration (HTTPS on Render)
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=RENAISSANCE_SESSION

# Reverse Proxy Configuration (Render Envoy / Cloudflare proxy headers)
server.forward-headers-strategy=framework

# Domain Redirection Configuration (Render -> Custom Domain)
app.redirect.enabled=${REDIRECT_ENABLED:true}
app.redirect.target-domain=${TARGET_DOMAIN:relianceattendance.site}
app.redirect.target-scheme=${TARGET_SCHEME:https}
app.redirect.old-domains=${OLD_DOMAINS:attendance-system-ivna.onrender.com,attendance-system-gfr7.onrender.com}
