# ========================================================
# Renaissance - Production Profile (Render + Railway MySQL)
# ========================================================

# Render dynamic port binding
server.port=${PORT:8080}

# Railway MySQL Datasource (Injected by Render Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (Reliable Production Settings)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=RenaissanceHikariPool

# JPA & Hibernate Settings for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Explicit Dialect Configuration as Supporting Setting
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Production Security Session Cookie Configuration (HTTPS on Render)
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=RENAISSANCE_SESSION
