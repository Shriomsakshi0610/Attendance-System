# Renaissance - Smart GPS-Based Attendance Management System Configuration

server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/

# MongoDB Database Configuration (MongoDB Atlas via Render / Local Environment Variables)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/renaissance_db}
spring.data.mongodb.auto-index-creation=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Security Session Configuration
server.servlet.session.timeout=${SESSION_TIMEOUT:24h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=RENAISSANCE_SESSION

# Admin Provisioning
renaissance.admin.email=${RENAISSANCE_ADMIN_EMAIL:admin@renaissance.edu}
renaissance.admin.password=${RENAISSANCE_ADMIN_PASSWORD:Admin@1234}
renaissance.admin.name=${RENAISSANCE_ADMIN_NAME:System Administrator}
renaissance.admin.employee-id=${RENAISSANCE_ADMIN_EMP_ID:ADM001}
renaissance.admin.reset-password-on-boot=${RENAISSANCE_ADMIN_RESET_PASSWORD_ON_BOOT:false}

# Teacher Provisioning
renaissance.teacher.email=${RENAISSANCE_TEACHER_EMAIL:teacher@renaissance.edu}
renaissance.teacher.password=${RENAISSANCE_TEACHER_PASSWORD:Teacher@1234}

# Geofence Settings
renaissance.geofence.radius-meters=${RENAISSANCE_GEOFENCE_RADIUS_METERS:40.0}
renaissance.geofence.max-allowed-gps-accuracy=100.0

# File Upload (For bulk student CSV imports)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
