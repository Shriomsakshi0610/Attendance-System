# Renaissance - Smart GPS-Based Attendance Management System Configuration

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/renaissance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Security Session Configuration
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=RENAISSANCE_SESSION

# Admin Provisioning (Default credentials if no teacher exists in DB)
renaissance.admin.email=${RENAISSANCE_ADMIN_EMAIL:teacher@renaissance.edu}
renaissance.admin.password=${RENAISSANCE_ADMIN_PASSWORD:Admin@1234}
renaissance.admin.name=${RENAISSANCE_ADMIN_NAME:Prof. Charles Babbage}
renaissance.admin.employee-id=${RENAISSANCE_ADMIN_EMP_ID:EMP001}

# Geofence Settings
renaissance.geofence.radius-meters=15.0
renaissance.geofence.max-allowed-gps-accuracy=100.0

# File Upload (For bulk student CSV imports)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
