<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login — Renaissance Attendance System</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #1e1b4b 0%, #31104b 100%);
        }
        .login-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }
        .login-header {
            background: linear-gradient(135deg, var(--accent-700), var(--secondary-700));
            color: #ffffff;
            padding: 2.25rem 2rem 1.75rem;
            text-align: center;
        }
        .login-logo {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 auto 1rem;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
        .login-body {
            padding: 2rem;
        }
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.15s ease;
        }
        .password-toggle-btn:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">R</div>
                <h2>Faculty Portal</h2>
                <p style="font-size: 0.875rem; margin-top: 0.35rem; opacity: 0.9;">Log in to manage attendance sessions and view analytics.</p>
            </div>

            <div class="login-body">
                <div id="login-error-alert" class="alert alert-danger" style="display: none;"></div>

                <form id="teacher-login-form">
                    <div class="form-group">
                        <label class="form-label" for="login-email">Faculty Email Address</label>
                        <input type="email" id="login-email" class="form-control" placeholder="name@renaissance.edu" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="login-password">Password</label>
                        <div class="password-container">
                            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" style="padding-right: 2.75rem;">
                            <button type="button" id="toggle-password-btn" class="password-toggle-btn" aria-label="Toggle password visibility">
                                <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                        Sign In to Dashboard →
                    </button>
                </form>

                <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid var(--surface-border-subtle); padding-top: 1.25rem;">
                    <div style="margin-bottom: 1rem; padding: 0.75rem; background: rgba(79, 70, 229, 0.08); border-radius: 8px; border: 1px solid rgba(79, 70, 229, 0.2); display: flex; align-items: center; justify-content: space-between;">
                        <div style="text-align: left;">
                            <div style="font-size: 0.825rem; font-weight: 700; color: var(--accent-700);">📱 Android Teacher App</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">With 40m GPS &amp; BLE Verification</div>
                        </div>
                        <a href="/api/public/app/download" class="btn btn-sm" style="font-size: 0.75rem; padding: 0.35rem 0.75rem; font-weight: 600; background: var(--accent-600); color: white; border-radius: 6px; text-decoration: none;">Download APK</a>
                    </div>

                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                        Are you an administrator?
                        <a href="/admin-login.html" style="color: var(--accent-600); font-weight: 600;">Sign in to Admin Portal →</a>
                    </p>
                    <a href="/index.html" style="font-size: 0.85rem; color: var(--text-muted);">← Back to Main Portal</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('teacher-login-form');
            const emailInput = document.getElementById('login-email');
            const passInput = document.getElementById('login-password');
            const togglePassBtn = document.getElementById('toggle-password-btn');
            const eyeIcon = document.getElementById('eye-icon');
            const errorAlert = document.getElementById('login-error-alert');
            const submitBtn = document.getElementById('login-submit-btn');

            // Ensure password is clear on load
            passInput.value = '';

            // Show / Hide Password Toggle
            let passwordVisible = false;
            togglePassBtn.addEventListener('click', () => {
                passwordVisible = !passwordVisible;
                passInput.type = passwordVisible ? 'text' : 'password';
                if (passwordVisible) {
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                } else {
                    eyeIcon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                }
            });

            // Check if redirected due to unauthorized or logout
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error') === 'unauthorized') {
                errorAlert.textContent = 'Please log in as an authorized teacher to access the dashboard.';
                errorAlert.style.display = 'block';
            } else if (urlParams.get('logout') === 'true') {
                App.showToast('You have been logged out successfully.', 'info');
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorAlert.style.display = 'none';

                const email = emailInput.value.trim();
                const password = passInput.value;

                if (!email || !password) {
                    errorAlert.textContent = 'Please enter both email and password.';
                    errorAlert.style.display = 'block';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';

                try {
                    const res = await Auth.login(email, password);
                    if (res && res.success) {
                        App.showToast('Login successful! Redirecting...', 'success');
                        const user = res.data?.teacher || res.data;
                        setTimeout(() => {
                            if (user && user.role === 'ROLE_ADMIN') {
                                window.location.href = '/admin-dashboard.html';
                            } else {
                                window.location.href = '/dashboard.html';
                            }
                        }, 500);
                    }
                } catch (err) {
                    errorAlert.textContent = err.message || 'Invalid email or password.';
                    errorAlert.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In to Dashboard →';
                }
            });
        });
    </script>
</body>
</html>
